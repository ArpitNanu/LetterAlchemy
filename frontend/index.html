<!doctype html>
<html lang="en">
  <head>
  <meta charset="UTF-8" />

  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
  <title>LetterAlchemy — Modern Writing Platform</title>

  <meta
    name="description"
    content="LetterAlchemy is a modern writing platform focused on thoughtful writing, clean reading experiences, and human-centered storytelling."
  />

  <meta
    name="keywords"
    content="blogging platform, writing app, react, cloudflare workers, full stack project, modern editor"
  />

  <meta name="author" content="Nizam" />

  <!-- Open Graph / LinkedIn -->
  <meta property="og:type" content="website" />

  <meta
    property="og:title"
    content="LetterAlchemy — Modern Writing Platform"
  />

  <meta
    property="og:description"
    content="A full-stack writing platform built with React, Cloudflare Workers, Prisma, Neon, and TypeScript."
  />

  <meta
    property="og:url"
    content="https://letteralchemy.pages.dev/"
  />

  <!-- Replace with your actual preview image -->
  <meta
    property="og:image"
    content="https://letteralchemy.pages.dev/og-preview.png"
  />

  <meta property="og:site_name" content="LetterAlchemy" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />

  <meta
    name="twitter:title"
    content="LetterAlchemy — Modern Writing Platform"
  />

  <meta
    name="twitter:description"
    content="A modern human-centered writing platform built from scratch."
  />

  <meta
    name="twitter:image"
    content="https://letteralchemy.pages.dev/og-preview.png"
  />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    rel="preconnect"
    href="https://backend.arpit-verma-av.workers.dev"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap"
    rel="stylesheet"
  />
</head>
  <body>
    <div id="root">
      <!-- STATIC APP SHELL (LCP Optimization) -->
      <style>
        body { margin: 0; background-color: #FAFAFA; }
        .app-shell {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          font-family: 'Inter', sans-serif;
        }
        .app-shell-logo {
          font-family: 'Newsreader', serif;
          font-size: 2rem;
          font-weight: 600;
          color: #111827;
          animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.4; }
        }
      </style>
      <div class="app-shell">
        <div class="app-shell-logo">LetterAlchemy</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
